name: ci

on:
  push:
  pull_request:

env:
  MPLBACKEND: Agg

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - run: uv sync --all-groups
      - run: uv run ruff format --check .
      - run: uv run ruff check .
      - run: uv run pytest --cov=dronefuse --cov-fail-under=80
      - run: uv run dronefuse run --scenario figure8 --estimator all --seed 0 --dropout 30:35 --out out
      - uses: actions/upload-artifact@v4
        with:
          name: plots
          path: out/
